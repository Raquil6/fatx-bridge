name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build release
        run: dotnet build .\FatxBridge.sln -c Release

      - name: Run FATX tests
        run: dotnet run --project .\tests\FatxBridge.Tests\FatxBridge.Tests.csproj -c Release --no-build
